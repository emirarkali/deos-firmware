# ============================================================
# Zephyr Project Configuration
# ============================================================

# Console / printk
CONFIG_PRINTK=y

# Assertions
CONFIG_ASSERT=y

# Logging
CONFIG_LOG=n

# Main thread stack
CONFIG_MAIN_STACK_SIZE=2048

# UART settings
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Ring Buffer for UART RX Queue
CONFIG_RING_BUFFER=y

# GPIO settings
CONFIG_GPIO=y

